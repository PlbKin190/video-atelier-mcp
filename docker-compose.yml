# Recent Compose required : env_file.required and additional_contexts.
# The server speaks MCP over stdio: a client connects via
#   docker compose run --rm -T atelier
# or directly via docker run -i (see the README). `up` starts the container
# but is not an MCP client on its own.
services:
  atelier:
    image: video-atelier-mcp:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      # The host directory must be accessible to the node user (UID 1000).
      - ./work:/work
    stdin_open: true
    tty: false

  atelier-sam2:
    image: video-atelier-mcp:sam2
    profiles: [sam2]
    build:
      context: .
      dockerfile: Dockerfile.sam2
      additional_contexts:
        atelier_base: service:atelier
      args:
        ATELIER_BASE_IMAGE: atelier_base
        # URLs to verify: absent from the inspected sources, no invented values.
        SAM2_OFFICIAL_GIT_URL: ${SAM2_OFFICIAL_GIT_URL:-}
        TORCH_CPU_INDEX_URL: ${TORCH_CPU_INDEX_URL:-}
    env_file:
      - path: .env
        required: false
    environment:
      HF_HOME: /work/models
      ATELIER_SAM2_DEVICE: cpu
    volumes:
      - ./work:/work
      - sam2-models:/work/models
    stdin_open: true
    tty: false

volumes:
  sam2-models:
